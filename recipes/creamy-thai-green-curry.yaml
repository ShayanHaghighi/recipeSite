---
title: Creamy Thai Green Curry
description: An aromatic and vibrant Thai curry featuring tender chicken, bamboo shoots, and coconut milk infused with fresh green curry paste and kaffir lime.
image: /recipes/thai-green-curry.jpg
prepTime: 15 mins
cookTime: 20 mins
---
ingredients:
  - 500g boneless chicken breast or thighs, thinly sliced
  - 400ml coconut milk
  - 3 tbsp green curry paste
  - 1 cup chicken broth
  - 1 cup bamboo shoots, drained
  - 1 red bell pepper, sliced
  - 4 kaffir lime leaves, torn
  - 1 tbsp fish sauce
  - 1 tsp palm sugar or brown sugar
  - Fresh Thai basil leaves
steps:
  - Heat 2 tablespoons of coconut milk in a large pot or wok over medium-high heat until the oil begins to separate.
  - Add the green curry paste and sauté for 1-2 minutes until fragrant and aromatic.
  - Add the sliced chicken and stir-fry for 3-4 minutes until lightly browned.
  - Pour in the remaining coconut milk and chicken broth, then bring to a gentle simmer.
  - Stir in the bamboo shoots, sliced red bell pepper, torn kaffir lime leaves, fish sauce, and sugar.
  - Simmer uncovered for 10 minutes until chicken is cooked through and vegetables are tender-crisp.
  - Turn off the heat and fold in fresh Thai basil leaves. Serve hot with jasmine rice.
