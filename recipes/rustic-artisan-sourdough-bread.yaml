---
title: Rustic Artisan Sourdough Bread
description: A crusty, naturally leavened artisanal loaf with an open airy crumb and a subtle sourdough tang.
image: /recipes/sourdough-bread.jpg
prepTime: 30 mins
cookTime: 45 mins
---
ingredients:
  - 450g bread flour
  - 50g whole wheat flour
  - 350g lukewarm water
  - 100g active bubbly sourdough starter
  - 10g fine sea salt
steps:
  - In a large bowl, whisk together the flours and water until fully incorporated; cover and autolyse for 45 minutes.
  - Add active sourdough starter and sea salt, dimpling and folding into the dough until thoroughly combined.
  - Perform 4 sets of stretch-and-folds spaced 30 minutes apart over a 2-hour bulk fermentation period.
  - Let dough rest undisturbed at room temperature until it has increased in volume by roughly 50%.
  - Pre-shape dough into a taut round boule, rest for 20 minutes, then do final shaping and place into a floured banneton basket.
  - Cover and cold-retard in the refrigerator for 12 to 16 hours.
  - Preheat a Dutch oven at 230°C (450°F) for 45 minutes. Score the dough loaf and carefully transfer into the Dutch oven.
  - Bake covered for 20 minutes, then remove lid and bake uncovered for an additional 25 minutes until deep golden brown. Cool completely before slicing.
