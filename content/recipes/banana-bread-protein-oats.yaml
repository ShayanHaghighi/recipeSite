---
title: Banana bread baked protein oats
description: A delicious recipe for Banana bread baked protein oats.
image: /recipes/banana-bread-protein-oats.jpg
prepTime: ''
cookTime: ''
tags: []
ingredients:
- 1 banana
- 1/2 cup rolled oats
- 1 egg
- Pinch baking powder (1/2 tsp)
- 20g vanilla protein powder, dissolved in water (or milk for extra protein 👀)
- 1/4 cup greek yogurt
- White chocolate chips (optional)
- Raspberry’s (optional)
steps:
- Mash the banana in an oven proof glass dish.
- Add all other ingredients and mix.
- Add any desired toppings.
- Bake for 15-20 minutes if you want a soft goody centre, or 35-40 minutes if you
  want a cakey texture
