---
title: Chicken taco recipe
description: A delicious recipe for Chicken taco recipe.
image: /recipes/chicken-taco.jpg
prepTime: ''
cookTime: ''
tags: []
ingredients:
- 7 chicken thighs (whole pack, 1kg)
- Garlic and ginger paste
- Tortilla wrap
- Coriander
- Cheddar cheese
- Cumin powder
- Cajun seasoning or all purpose seasoning or both
- Paprika
- White pepper
- Black pepper
- Mixed herbs
- Chilli flakes
- Honey
- BBQ sauce
- 1/2 Lime or 1/2 lemon
- 1 chicken stock cube
- Tomato puree
- 1 red onion
- Olive oil

steps:
  - To begin with, marinate your chicken by adding the cumin powder, all-purpose seasoning, Cajun seasoning, black pepper, mixed herbs, paprika, white pepper, olive oil, barbecue sauce, juice of half a lemon, and tomato purée to a bowl. Mix these together and then add your chicken thighs.
  - Next, thinly slice your onion and grate your ginger and garlic. If you already have a paste, you don't need to grate these.
  - Add a drizzle of olive oil to a pot and add your marinated chicken thighs. Sear both sides for about five minutes each, then remove them from the pot.
  - Add the chicken back into the pot and add your chicken stock. For my chicken stock, I used one chicken Oxo cube dissolved in a little boiling water, then filled up the pot with some more water.
  - In the same pot, add your onions, garlic, and ginger and cook them together.
  - The water level should almost submerge the chicken thighs. Add the lid and cook for about 30 minutes to 1 hour, depending on how much chicken you have.
  - Take off the lid, remove and shred the chicken thighs, then add them back to the pot.
  - With the lid off, cook the chicken until most of the liquid has evaporated.
  - I usually add a little more barbecue sauce to the chicken at this stage and stir it in.
  - Dip the tortilla wrap in the sauce, add it to a pan, then add the chicken, cheese, and coriander.
  - Serve 😊
