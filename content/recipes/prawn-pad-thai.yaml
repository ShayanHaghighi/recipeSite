ingredients:
- Ingredients (2 servings)
- Bean sprouts
- Coriander
- 2 eggs
- Spring onion
- 2 tbsp sugar
- Flat rice noodles
- Handfull of thinly sliced carrots
- 1/2 red onion
- Pack of prawns seasoned with garlic powder, salt, white pepper and cajun seasoning
- 4 garlic cloves
- 2 shallots
- Tiny squirt of siracha
- Dash oyster sauce
- Dash soy sauce
- 1/4 chicken stock
- 1.5 tbsp fish sauce
- 3 tbsp tamarind
- Sauce
- Tamarind
- Fish sauce
- Soy sauce
- Chicken stock
- Oyster sauce
- Tiny squirt of siracha
steps:
- Place noodles in boiling water for 1-2 mins, drain and leave aside
- Season prawns and cook prawns for 4 mins in pan, and then remove
- Add minced garlic, shallots and red onions to the pan
- Add the brown sugar
- Add the sauce
- Add noodles
- Add carrots
- Push to the side, crack in 2 eggs and scramble once cooked
- Add in spring onions, bean sprouts and prawns
- Garnish with fresh coriander and 1/4 wedge of lime
