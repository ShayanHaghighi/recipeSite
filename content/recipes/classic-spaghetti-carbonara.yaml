---
title: Classic Spaghetti Carbonara
description: A traditional Roman pasta dish made with eggs, Pecorino Romano cheese, cured guanciale, and freshly cracked black pepper.
image: /recipes/carbonara.jpg
prepTime: 10 mins
cookTime: 15 mins
tags:
  - Italian
  - Pork
  - Pasta
  - Comfort Food
  - Dinner

ingredients:
  - 400g spaghetti
  - 150g guanciale or pancetta, diced
  - 4 large egg yolks + 1 whole egg
  - 100g freshly grated Pecorino Romano
  - Freshly ground coarse black pepper
  - Sea salt for pasta water
steps:
  - Bring a large pot of salted water to a gentle rolling boil.
  - In a bowl, whisk together the eggs, egg yolk, grated Pecorino Romano, and generous freshly cracked black pepper until a thick paste forms.
  - In a skillet over medium heat, fry the diced guanciale until golden and crispy. Remove from heat and reserve the rendered fat.
  - Boil spaghetti until just al dente, reserving 1/2 cup of starchy pasta water.
  - Transfer hot pasta directly into the skillet with guanciale and toss to coat with the fat.
  - Slowly pour the egg and cheese mixture into the pasta while tossing vigorously, adding small splashes of reserved pasta water to create a creamy sauce without scrambling the eggs.
  - Plate immediately and top with additional Pecorino Romano and freshly ground black pepper.
---
