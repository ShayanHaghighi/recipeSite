---
title: Tabbouleh
description: A delicious recipe for Tabbouleh.
image: /recipes/tabbouleh.jpg
prepTime: ''
cookTime: ''
tags: []
ingredients:
- ½ cup quinoa
- ¾ cup water
- pomegranate
- ⅓ cup extra virgin olive oil
- ½ teaspoon salt
- ½ teaspoon black pepper
- ⅓ cup lemon juice
- 3 bunches parsley finely chopped (3 cups)
- ¼ cup fresh mint finely chopped
- 4 green onions very finely chopped
- 2 tomatoes finely chopped
steps:
- Heat a small saucepan over medium-high heat. Add the quinoa to a dry pan and toast
  it, stirring frequently until it begins to pop, turns somewhat golden brown, and
  smells nutty, about 5 minutes.
- Add water and bring it to a boil. Reduce to a simmer and cover. Cook until the quinoa
  is tender, about 15 minutes. Turn off the heat and let the quinoa rest for 5 minutes.
  Uncover, fluff with a fork, and let it cool to room temperature.
- While the quinoa cools, make the dressing by stirring together olive oil, lemon
  juice, salt, and pepper in a bowl.
- In a large bowl, place the chopped parsley, chopped mint leaves, green onions, and
  tomatoes. Add the cooled quinoa and pour the dressing over the top. Stir gently
  to combine. Taste and add more salt and pepper if you like. Serve at room temperature
  or chilled.    ▢ ½ cup quinoa
