---
title: chilli paneer recipe
description: A delicious recipe for chilli paneer recipe.
image: /recipes/chilli-paneer.jpg
prepTime: ''
cookTime: ''
tags: []
ingredients:
- chilli flakes/powder
- red or green chilli
- green spring onions
- ketchup
- dark soy sauce
- rice vinegar
- green chilli sauce
- tomato puree
- sesame oil
- corn flour
- plain flour
- paneer
- 2/3 garlic cloves
- pepper
- 2/3 onions
steps:
- add 3 tablespoons of plain flour and 3 tablespoons of corn flour, plus chilli flakes
  & salt to a bowl.
- then add about 8/9 tablespoons of water to this mixture
- cut paneer into cubed sized pieces and place this into the bowl. mix so the paneer
  is all coated
- heat a pan with olive oil and fry the paneer until golden brown on all sides. make
  sure they’re not touching or they’ll stick together
- drain them on kitchen tissue or in a colander, and put to one side
- then cut up your vegetables (you could do this earlier if you prefer) into small
  cubes (peppers and onions). also cut your chilli, spring onions and garlic
- heat a pan with a tiny bit of olive oil and saute your garlic
- switch flame to high, add sesame oil and then fry all other vegetables
- once they’ve cooked almost all the way (they can be crispy or soft depending on your preference), add ketchup*, 3 tablespoons green chilli sauce, 2 table spoons soy sauce, 1 1/2 of vinegar to the pan. mix together.
- add your paneer to the pan and mix everything together
- season with chilli flakes, basil, salt, little bit of veggie stock cube, cumin,
  black pepper (whatever really)
- add more ketchup/sauce if needed
- serve with rice/naan/top w sesame seeds etc :)
- '*i don’t measure ketchup, just add however much you need. i don’t really measure
  the other sauces now either but it’s helpful for the first time to make sure you
  don’t make it too spicy'
