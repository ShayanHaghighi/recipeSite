---
title: American Pancakes
description: A classic American breakfast dish made with self-raising flour, eggs, and milk.
image: /recipes/carbonara.jpg
prepTime: 10 mins
cookTime: 20 mins
tags:
  - Breakfast
  - Dessert
  - Comfort Food

ingredients:
  - 1 cup + 1tbsp self-raising flour
  - Dash of salt
  - 3 tbsp sugar
  - 180ml milk
  - 1 egg
  - Vanilla extract
steps:
  - In a bowl, whisk together the flour, salt, sugar, milk, egg, and vanilla extract until smooth.
  - Heat a non-stick frying pan over medium heat and add a small amount of oil.
  - Pour batter into the pan and cook until bubbles appear on the surface.
  - Flip the pancake and cook for another 1-2 minutes on the other side.
  - Repeat with remaining batter.
---
