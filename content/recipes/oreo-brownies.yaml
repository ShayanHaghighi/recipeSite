---
title: Oreo Brownies
description: A delicious recipe for Oreo Brownies.
image: /recipes/carbonara.jpg
prepTime: 15 mins
cookTime: 30 mins
tags: []
ingredients:
- 3/4 cup (95 grams) all-purpose flour
- 1/2 teaspoon salt
- 1/2 cup (43 grams) unsweetened Dutch-processed cocoa powder
- 3/4 cup (170 grams) unsalted butter
- 3 Tablespoons (35 grams) oil (canola, vegetable, or coconut)
- 1 and 1/2 cups (300 grams) granulated sugar, divided
- 2 teaspoons vanilla extract
- 2 large eggs plus 1 egg yolk
- 3/4 cup (128 grams) semi-sweet chocolate chips
- 14 Oreo Cookies, roughly chopped
steps:
- Preheat the oven to 350 degrees. Line a 9x9-inch baking pan with parchment paper.
  Spray lightly with non-stick baking spray and set aside.
- In a large bowl, sift together the flour, salt, and cocoa powder. Set aside until
  needed.
- In a medium saucepan, combine the butter, oil, and 1/2 cup of the sugar. Heat over
  medium heat, stirring frequently, until butter is completely melted. Remove from
  heat.
- In a large mixing bowl, combine the eggs, egg yolk, and remaining sugar. Whisk until
  well combined, about 30 seconds. Stir in vanilla.
- Slowly, pour the warm butter mixture into the egg mixture, adding it very gradually
  (a little bit at a time) and whisking constantly until completely combined.
- Add in the dry ingredients and, using a rubber spatula, slowly stir until just combined.
- Finally, fold in the chocolate chips and 1/2 of the Oreo cookies. Do not over mix!
- Scrape the batter into the prepared pan and smooth the top. Press the remaining
  Oreo cookies on top of the batter.
- Bake for 30 minutes, or until the edges are firm and the top is shiny and slightly
  cracked.
- Place the pan on a cooling rack and cool for at least 2 hours before slicing.
