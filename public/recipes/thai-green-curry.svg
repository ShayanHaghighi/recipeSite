<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="curryBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2e26"/>
      <stop offset="60%" stop-color="#181c15"/>
      <stop offset="100%" stop-color="#0a0d09"/>
    </radialGradient>
    <radialGradient id="curryBowl" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="80%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </radialGradient>
    <radialGradient id="broth" cx="48%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="35%" stop-color="#65a30d"/>
      <stop offset="70%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
    <filter id="curryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient dark slate/bamboo background -->
  <rect width="800" height="1000" fill="url(#curryBg)"/>
  
  <!-- Bamboo mat lines -->
  <g stroke="#262c20" stroke-width="2" opacity="0.5">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="760" x2="800" y2="760"/>
    <line x1="0" y1="880" x2="800" y2="880"/>
  </g>

  <!-- Shadow under bowl -->
  <ellipse cx="400" cy="510" rx="300" ry="280" fill="#040604" opacity="0.85" filter="url(#curryGlow)"/>

  <!-- Artisan ceramic bowl -->
  <ellipse cx="400" cy="490" rx="280" ry="260" fill="url(#curryBowl)" stroke="#4a5568" stroke-width="7"/>
  <ellipse cx="400" cy="490" rx="268" ry="248" fill="none" stroke="#2d3748" stroke-width="2"/>

  <!-- Rich green curry broth -->
  <ellipse cx="400" cy="490" rx="230" ry="210" fill="url(#broth)"/>

  <!-- Swirls of silky coconut cream -->
  <g fill="none" stroke="#fefce8" stroke-width="12" stroke-linecap="round" opacity="0.8" filter="url(#curryGlow)">
    <path d="M 330 440 C 370 410, 440 420, 470 460 C 500 500, 440 550, 380 540 C 330 530, 340 470, 390 470"/>
    <path d="M 410 430 C 470 450, 460 520, 410 520"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M 350 450 C 380 430, 430 435, 455 470 C 475 500, 435 535, 395 530"/>
  </g>

  <!-- Tender chicken pieces -->
  <g fill="#fef3c7" stroke="#d97706" stroke-width="1.5">
    <ellipse cx="360" cy="470" rx="32" ry="20" transform="rotate(-20 360 470)"/>
    <ellipse cx="445" cy="510" rx="36" ry="22" transform="rotate(15 445 510)"/>
    <ellipse cx="420" cy="430" rx="28" ry="18" transform="rotate(-35 420 430)"/>
    <ellipse cx="340" cy="525" rx="30" ry="19" transform="rotate(30 340 525)"/>
  </g>

  <!-- Vibrant red chili slices -->
  <g fill="#dc2626" stroke="#991b1b" stroke-width="2">
    <ellipse cx="380" cy="430" rx="20" ry="8" transform="rotate(45 380 430)"/>
    <ellipse cx="470" cy="470" rx="22" ry="9" transform="rotate(-30 470 470)"/>
    <ellipse cx="395" cy="540" rx="19" ry="8" transform="rotate(20 395 540)"/>
    <ellipse cx="320" cy="480" rx="18" ry="7" transform="rotate(-60 320 480)"/>
  </g>

  <!-- Bamboo shoots strips -->
  <g fill="#fef08a" opacity="0.85">
    <rect x="420" y="470" width="38" height="9" rx="2" transform="rotate(65 439 474)"/>
    <rect x="350" y="415" width="34" height="8" rx="2" transform="rotate(-40 367 419)"/>
    <rect x="440" y="530" width="36" height="8" rx="2" transform="rotate(-15 458 534)"/>
  </g>

  <!-- Fresh Thai Basil leaves -->
  <g fill="#15803d" stroke="#166534" stroke-width="2">
    <path d="M 400 470 Q 420 440 450 450 Q 440 480 400 470 Z"/>
    <path d="M 370 500 Q 340 480 345 455 Q 375 470 370 500 Z"/>
    <path d="M 430 495 Q 460 505 455 530 Q 425 520 430 495 Z"/>
    <path d="M 390 460 Q 370 435 395 425 Q 405 450 390 460 Z"/>
  </g>
  <!-- Basil leaf vein highlights -->
  <path d="M 400 470 Q 430 455 450 450" stroke="#86efac" stroke-width="1.2" fill="none"/>
  <path d="M 370 500 Q 355 475 345 455" stroke="#86efac" stroke-width="1.2" fill="none"/>
</svg>
